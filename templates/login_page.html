<!DOCTYPE html>

<html>
	<head>
		<title>login_page</title>
	</head>
	<body style = "height:1200px ; width:1366px ; display:flex ; background-color:#0B001F ; justify-content:center ; align-items:center;">
		<div class = "main_page">
		
		
			<!--------------------------------------------------------------------------------->
			<!-----------------------------------IMAGE PREPARING------------------------------->
			<!--------------------------------------------------------------------------------->
			
			<div class = "logo_image_box_on_upper_ribbon">
			
				<img src="../static/RJ_logo_for_upper_ribbon.png" width="50px" height="50px" style = "position:absolute ;  top:5px ; left:0px ;opacity : 0.9">
			
			</div>
			
			<style>
				.logo_image_box_on_upper_ribbon{
					position:fixed;
					left:15px;
					top:5px;
					width:50px;
					border-radius:0px;
					height:60px;
					
					z-index :5;
					background-color:none;
					}
					
				
			</style>
			

			<!---------------------------------hover on image-------------------------------------------->
			
			<div class = "logo_image_box_upper_ribbon_ka_hover">
			
			</div>
			
			<style>
				.logo_image_box_upper_ribbon_ka_hover{
					position:fixed;
					left:15px;
					top:10px;
					width:50px;
					cursor:pointer;
					background-color:none;
					height:50px;
					border:1px solid #ffffff;
					border-radius:5px;
					z-index :7;
					transition:0.2s ease ;
					z-index:12
					}
					
				.logo_image_box_upper_ribbon_ka_hover:hover{
				box-shadow:0px 0px 8px #ffffff;
				}
				
			</style>
			
			<!------------------------------upper_heading_background_image----------------------->
			
			<div class = "upper_heading_background_track_lines">
			
				<svg class = "drawing_board_1_on_upper_heading"></svg>
			
			</div>
			
			<style>
				
				.drawing_board_1_on_upper_heading{
					position:fixed;
					top:5px;
					left:5px;
					width:1366px;
					height:60px;
					background-color:none;
					z-index:11}
				
				.upper_heading_background_image{
					position:fixed;
					left:0px;
					top:0px;
					height:70px;
					width:1366px;
					opacity:1;
					z-index :5;
					background-color:#170040
					}
			</style>
			
			<!-----------------------------------upper_heading----------------------------------->
			
			<div class = "top_heading_box">
				<h1 style = "color:#ffffff ;font-family:Century Gothic ; font-weight:500; text-align:center  ">THE WORKOUT ZONE</h1>
			</div>	
			<style>
			.top_heading_box{
				position:fixed;
				display:flex;
				align-items:center;
				justify-content:flex-start;
				padding-left:80px;
				height:70px;
				width:1366px;
				top:0px;
				left:0px;
				background-color:none;
				z-index:2}
			
			</style>
			
			<!-----------------------------------upper_heading polygon box---------------------->
			
			<div class = "upper_heading_polygon_box">
			
				<svg  viewBox = "0 0 500 80">
					
					<polygon
					
						points = "0,-1 0,70 400,70 440,-1"
						stroke = "#ffffff"
						stroke-width = "1"
						fill = "none"
						style = "filter:drop-shadow(0px 0px 5px #ffffff)"					
					/>
					
				</svg>
			
			</div>
			
			<style>
			
			.upper_heading_polygon_box{
				position:fixed;
				height:70px;
				width:500px;
				top:0px;
				left:0px;
				background-color:none;
				
				z-index:2
				
				}
			
			</style>
			
			
			<!--------------------------------------------------------------------------------->
			<!-----------------------------------IMAGE PREPARING------------------------------->
			<!--------------------------------------------------------------------------------->
			
			<div class = "logo_image_box">
			
				<img src = "../static/RJ_Techs_logo.png" width = "650px" height = "550px" />
			
			</div>
			
			<style>
				.logo_image_box{
					position:fixed;
					left:395px;
					top:130px;
					width:600px;
					height:500px;
					opacity:0.03;
					z-index :4
					}
			</style>
			
			<!---------------------BACKGROUND IMAGE OF WEBSITE PAGE------------------>
			
			<div class = "BACKGROUND_image_box">
			
				<img src="../static/background_of_website_page.png" width = "1366px" height = "1200px" />
			
			</div>
			
			<style>
				.BACKGROUND_image_box{
					position:fixed;
					left:0px;
					top:0px;
					width:1366px;
					height:1200px;
					opacity:0.15;
					z-index :1
					}
			</style>
			
			
		<!-------------------------------------------------------------------------------------------------------------------------------------------------------------------------->	
		<!-------------------------------------------------------------------------------------------------------------------------------------------------------------------------->	
		<!-------------------------------------------------- LOGIN SETUP OF WEBSITE ------------------------------------------------------------------------------------------------>	
		<!-------------------------------------------------------------------------------------------------------------------------------------------------------------------------->	
		<!-------------------------------------------------------------------------------------------------------------------------------------------------------------------------->	
			
		<script>
		
			function back_to_the_history_page_from_login_page(){
				window.history.back()}
		
		</script>
			
		<!--LOGIN POLYGON BOX-->	
		
		<div class = "polygon_login_box_parent"  >
		
			<svg viewBox = "-50 -10 1366 1200" class = "polygon_login_box" style = "  animation:moving_upward_polygon_box 0.3s linear 0s forwards">
			
					<polygon 
				
					points = "383,150 433,100 983,100 983,550 933,600 383,600"
					stroke-width = "2"
					stroke = "#7569FC70"
					fill = "none"
				
				/>
			</svg>
		
		</div>
		
		<!--- LOGIN ENTRY BOX --->
		
		<div class = "div_parent_for_login_box">
			
			<h1 class = "heading_1_ki_style">LOGIN TO CONTINUE</h1>
			
			<div class = "line_below_LOGIN_TO_CONTINUE_heading"></div>
			
			<h2 class = "heading_2_username" >USERNAME</h2>
			
			<h2 class = "heading_2_password" >PASSWORD</h2>
			
			<input class = "entry_box_of_username_for_login" placeholder = "Enter Username"></input>
			
			<input class = "entry_box_of_password_for_login" placeholder = "Enter Password" type = "password"></input>
			
			<div onclick = "password_show_and_hide_function()"class = "eye_show_and_hide_for_password">
			
				 <svg width="22" height="22"
					 viewBox="0 0 24 24"
					 fill="none"
					 stroke="#7569FC"
					 stroke-width="2"
					 stroke-linecap="round"
					 stroke-linejoin="round">

					<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
					<circle cx="12" cy="12" r="3"/>

				</svg>
						
			</div>
			
			<!------- LOGIN KO CONTINUE KARO KA BUTTON ------>
			
			<div class = "LOGIN_continue_button" >
		
				Continue
			
				<div class = "login_CONTINUE_button_briting_linig_clipped_area">
				
					<div class = "briting_lining_on_login_CONTINUE_button"></div>
				
				</div>
		
			</div>
			
			<!------- LOGIN KO CANCEL KARO KA BUTTON ------>
			
			<div onclick = "back_to_the_history_page_from_login_page()" class = "LOGIN_cancel_button" >
		
				Cancel
			
				<div  class = "login_CANCEL_button_briting_linig_clipped_area">
				
					<div class = "briting_lining_on_login_CANCEL_button"></div>
				
				</div>
		
			</div>
			
		</div>
		
		<style>
			.heading_1_ki_style{position:absolute;display:flex;justify-content:center;color:#ffffff;width:100%;letter-spacing:3px;font-family:Century Gothic;font-size:35px;font-weight:400}

			.line_below_LOGIN_TO_CONTINUE_heading{position:absolute;top:100px;width:540px;left:30px;height:1px;background-color:#ffffff;z-index:14}

			.heading_2_username{position:absolute;color:#ffffff;top:120px;left:100px;font-family:Century Gothic;font-size:25px;font-weight:100;}

			.entry_box_of_username_for_login{position:absolute;top:180px;left:100px;padding-left:10px;border:2px solid #000000;border-radius:10px;width:350px;height:50px;background-color:#FFFFFF;color:#000000;font-family:Century Gothic;font-size:20px;font-weight:100;transition:0.3s all}
			
			.entry_box_of_username_for_login:hover{box-shadow:0px 0px 10px #8390B5}

			.entry_box_of_username_for_login::placeholder{position:absolute;top:15px;left:10px;color:#000000;font-family:Century Gothic;font-size:15px;font-weight:100;}

			.entry_box_of_username_for_login:focus{box-shadow:0px 0px 20px #0A001C;transform:translate(0px,-2px)scale(1.02);outline:2px solid #0A001C;border:1px solid #ffffff}

			.heading_2_password{position:absolute;color:#ffffff;top:250px;left:100px;font-family:Century Gothic;font-size:25px;font-weight:100;}

			.entry_box_of_password_for_login{position:absolute;top:310px;left:100px;padding-left:10px;border:2px solid #000000;border-radius:10px;width:350px;height:50px;background-color:#FFFFFF;color:#000000;font-family:Century Gothic;font-size:20px;font-weight:100;transition:0.3s all}

			.entry_box_of_password_for_login:hover{box-shadow:0px 0px 10px #8390B5}

			.entry_box_of_password_for_login::placeholder{position:absolute;top:15px;left:10px;color:#000000;font-family:Century Gothic;font-size:15px;font-weight:100;}

			.entry_box_of_password_for_login:focus{box-shadow:0px 0px 20px #0A001C;transform:translate(0px,-2px)scale(1.02);outline:2px solid #0A001C;border:1px solid #ffffff}

			.main_page:has(.entry_box_of_password_for_login:focus) .eye_show_and_hide_for_password{transform:translate(0px,-2px)scale(1.02);}

			.div_parent_for_login_box{position:absolute;top:110px;width:600px;left:433px;height:500px;background-color:none;z-index:14;animation:moving_upward_parent_box 0.3s linear 0s forwards}

			.eye_show_and_hide_for_password{position:absolute;display:flex;justify-content:center;align-items:center;top:325px;width:25px;left:405px;height:25px;border-radius:5px;background-color:#ffffff;cursor:pointer;transition:0.5s all;border:1px solid #8390B5}

			.eye_show_and_hide_for_password:hover{background-color:#B9CAFF;}	
		</style>
		
		<!------------------------------- boxes ko upar lane ke liye keyframe ----------------------------------------->
		
		<style>
		
		@keyframes moving_upward_parent_box{ 0%{top:400px} 100%{top:110px;}}
		
		@keyframes moving_upward_polygon_box{ 0%{opacity:0} 100%{opacity:1}}
		
		@keyframes moving_HAVE_NOT_AN_ACCOUNT_with_keyframe{ 0%{top:-100px} 100%{top:620px}}
		
		</style>
		
		<!------------------------------------------------------------------------------------------------------>
		
		<!------------------------------------------------------------------------------------------------------>	
		<!------------------------- EyE KE UPAR MOUSE AANE SE PASSWORD KA SHOW HO JAANA ------------------------>	
		<!------------------------------------------------------------------------------------------------------>	
		
		<script>
		
		<!------------------- SHOW AND HIDE PASSWORD ON HOVER OF ENTRY BOX  -------------------->
		
			document.querySelector(".eye_show_and_hide_for_password").addEventListener("mouseenter",function(){document.querySelector(".entry_box_of_password_for_login").type = "text"})
			
			document.querySelector(".eye_show_and_hide_for_password").addEventListener("mouseleave",function(){document.querySelector(".entry_box_of_password_for_login").type = "password"})
			
		</script>

		<!---------------------------------------- LOGIN CONTINUE BUTTON and CANCEL BUTTON -------------------------------------------->	
		
		<style>	
		
			.LOGIN_continue_button{ overflow:hidden; position:absolute; display:flex; top:410px; left:370px; font-family:Century Gothic; font-weight:200; font-size:20; justify-content:center; align-items:center; color:#ffffff; width:130px; height:40px; cursor:pointer; background-color:none; border:2px solid #ffffff; border-radius:10px; transition:0.3s ease; z-index:11; }

			.login_CONTINUE_button_briting_linig_clipped_area{ overflow:hidden; position:absolute; clip-path:inset(0 round 10px); display:flex; top:520px; left:796px; justify-content:center; align-items:center; width:130px; height:40px; background-color:none; border:2px solid #ffffff; border-radius:10px; transition:0.3s ease; z-index:10s; }

			.LOGIN_continue_button:hover{ box-shadow:0px 0px 10px #ffffff; transform:translate(0px,-1px)scale(1.02)}

			.briting_lining_on_login_CONTINUE_button{ position:absolute; overflow:hidden; top:420px; left:370px; display:flex; margin-top:0px; background-color:#ffffff00; color:#0B001F; height:100px; width:20px; align-items:center; justify-content:center; font-size:70px; font-weight:400; font-family:Century Gothic; box-shadow:40px 70px 20px #ffffff; transform:rotate(30deg); animation:moving_brighting_rod_on_login_CONTINUE_box 3s linear 0s infinite; }

			@keyframes moving_brighting_rod_on_login_CONTINUE_box{ 0%{left:700px;} 50%{left:1000px;} 100%{left:1001px;} }
			
			
			.LOGIN_cancel_button{ overflow:hidden; position:absolute; display:flex; top:410px; left:100px; font-family:Century Gothic; font-weight:200; font-size:20; justify-content:center; align-items:center; color:#ffffff; width:130px; height:40px; cursor:pointer; background-color:none; border:2px solid #ffffff; border-radius:10px; transition:0.3s ease; z-index:11; }

			.login_CANCEL_button_briting_linig_clipped_area{ overflow:hidden; position:absolute  ; clip-path:inset(0 round 10px); display:flex; top:520px; left:526px; justify-content:center; align-items:center; width:130px; height:40px; background-color:none; border:2px solid #ffffff; border-radius:10px; transition:0.3s ease; z-index:10s; }

			.LOGIN_cancel_button:hover{ box-shadow:0px 0px 10px #ffffff; transform:translate(0px,-1px)scale(1.02)}

			.briting_lining_on_login_CANCEL_button{ position:absolute; overflow:hidden; top:420px; left:100px; display:flex; margin-top:0px; background-color:#ffffff00; color:#0B001F; height:100px; width:20px; align-items:center; justify-content:center; font-size:70px; font-weight:400; font-family:Century Gothic; box-shadow:40px 70px 20px #ffffff; transform:rotate(30deg); animation:moving_brighting_rod_on_login_CANCEL_box 3s linear 0s infinite; }

			@keyframes moving_brighting_rod_on_login_CANCEL_box{ 0%{left:400px;} 50%{left:700px;} 100%{left:701px;} }
		
		</style>
		
		
		<!---------------------------------------- have not an account below box -------------------------------------------->
		
		<script>
		
		function go_to_create_account_page(){
			window.open("create_a_new_account_page.html","_self")}
		
		</script>
		
		<div onclick = "go_to_create_account_page()" class = "create_account_button_as_heading">Haven't an Account ?</div>
		
		<style>
		
		.create_account_button_as_heading{position:absolute ; display:flex ;justify-content:center ; font-family:Century Gothic ; align-items:center ; top:620px ; left:580px ; border-radius:7px ; width:300px ; height:30px ; background-color:none ; border:2px solid #ffffff ; cursor:pointer ; color : #ffffff ;transition:0.3s all ; animation:moving_HAVE_NOT_AN_ACCOUNT_with_keyframe 0.3s linear 0s forwards; z-index:11}

		.create_account_button_as_heading:hover{box-shadow:0px 0px 7px #ffffff;transform:translate(0px,-1px)scale(1.02)}
		
		</style>
		
		
		
			
		</div>
		<style>
		.main_page{
			position:absolute;
			top:0px;
			width:1366px;
			height:1200px;
			background-color:#0B001F}
		</style>
			
	</body>

</html>
