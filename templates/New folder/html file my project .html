
<!DOCTYPE html>
<html>
<head>
    <title>RJ Animation</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100%;
            height:100vh;
            background:#080014;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Century Gothic;
            overflow:hidden;
        }

        .main_box{
            text-align:center;
        }

        /* WELCOME + LET'S START */

        .heading{
            color:white;
            font-size:65px;
            font-weight:bold;
            letter-spacing:5px;
        }

        .line{
            display:block;
            margin:10px;
        }

        /* Individual letters */

        .letter{
            display:inline-block;
            opacity:0;
            animation:letter_entry 0.75s cubic-bezier(.2,.8,.3,1.3) forwards;
        }

        /* WELCOME delays */

        .welcome .letter:nth-child(1){animation-delay:0.30s;}
        .welcome .letter:nth-child(2){animation-delay:0.42s;}
        .welcome .letter:nth-child(3){animation-delay:0.54s;}
        .welcome .letter:nth-child(4){animation-delay:0.66s;}
        .welcome .letter:nth-child(5){animation-delay:0.78s;}
        .welcome .letter:nth-child(6){animation-delay:0.90s;}
        .welcome .letter:nth-child(7){animation-delay:1.02s;}

        /* LET'S START delays */

        .start .letter:nth-child(1){animation-delay:1.55s;}
        .start .letter:nth-child(2){animation-delay:1.67s;}
        .start .letter:nth-child(3){animation-delay:1.79s;}
        .start .letter:nth-child(4){animation-delay:1.91s;}
        .start .letter:nth-child(5){animation-delay:2.03s;}

        .start .letter:nth-child(7){animation-delay:2.15s;}
        .start .letter:nth-child(8){animation-delay:2.27s;}
        .start .letter:nth-child(9){animation-delay:2.39s;}
        .start .letter:nth-child(10){animation-delay:2.51s;}
        .start .letter:nth-child(11){animation-delay:2.63s;}

        /* Exclamation mark */

        .exclamation{
            display:inline-block;
            opacity:0;
            animation:letter_entry 0.8s cubic-bezier(.2,.8,.3,1.3) forwards;
            animation-delay:3.05s;
            color:#9B5CFF;
        }

        /* Letter animation */

        @keyframes letter_entry{

            0%{
                transform:translateY(100px);
                opacity:0;
            }

            65%{
                transform:translateY(-18px);
                opacity:1;
            }

            82%{
                transform:translateY(8px);
            }

            100%{
                transform:translateY(0px);
                opacity:1;
            }

        }

        /* START BUTTON */

        .start_button{
            margin-top:45px;
            padding:15px 55px;
            border:2px solid #9B5CFF;
            border-radius:40px;
            background:#26006B;
            color:white;
            font-size:17px;
            letter-spacing:3px;
            cursor:pointer;

            opacity:0;

            animation:button_entry 0.7s ease forwards;
            animation-delay:3.85s;

            transition:0.3s ease;
        }

        .start_button:hover{
            background:#9B5CFF;
            box-shadow:0px 0px 25px #9B5CFF;
            transform:scale(1.08);
        }

        @keyframes button_entry{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }

        }

        /* NEXT SECTION */

        .next_page{
            height:100vh;
            background:#170040;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:35px;
        }

    </style>
</head>

<body>

    <div class="main_box">

        <div class="heading">

            <div class="line welcome">
                <span class="letter">W</span>
                <span class="letter">E</span>
                <span class="letter">L</span>
                <span class="letter">C</span>
                <span class="letter">O</span>
                <span class="letter">M</span>
                <span class="letter">E</span>
            </div>

            <div class="line start">
                <span class="letter">L</span>
                <span class="letter">E</span>
                <span class="letter">T</span>
                <span class="letter">'</span>
                <span class="letter">S</span>

                <span class="letter">S</span>
                <span class="letter">T</span>
                <span class="letter">A</span>
                <span class="letter">R</span>
                <span class="letter">T</span>

                <span class="exclamation">!</span>
            </div>

        </div>

        <a href="#next">
            <button class="start_button">START</button>
        </a>

    </div>

    <div class="next_page" id="next">
        WELCOME TO RJ PROJECTS
    </div>

</body>
</html>
