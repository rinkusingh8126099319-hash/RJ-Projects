
<!DOCTYPE html>
<html>
<head>
	<script type="module"
	src="https://pyscript.net/releases/2025.3.1/core.js">
	</script>
    <title>WORKOUT DASHBOARD</title>   
	
</head>

<body class = "main_page">

	<style>
	
        .main_page{
			background-color:#06070F;
			width:1366px ;
			height:1800px;
				}
				
    </style>
	
	<div class = "upper_circle" >
	
		<div class = "lower_circle"><div class = "small_mid_circle"></div></div>
		
		

	</div>
		
	<style>
	
		.upper_circle{
			position:absolute;
			background-color:#06070f;
			display:flex;
			flex-direction:row;
			top:200px;
			left:500px;
			width:300px;
			height:300px;
			border-radius:170px;
			border-color:#171B3B;
			border-width:8px;
			border-style:solid;
			text-align:center;
			justify-content:center;
			align-items:center;
			gap:40px;
			box-shadow:0px 0px 20px #ffffff;
			z-index:1
			}
			
		.lower_circle{
			
			background-color:#06070f;
			
			display:flex;
			width:287px;
			height:287px;
			border-radius:170px;
			border-color:#21A0FF;
			border-width:2px;
			border-style:solid;
			font-family:Century Gothic;
			font-weight:normal;
			font-size:10px;
			color:#ffffff;
			justify-content:center;
			align-items:center;
			z-index:2}
				
		.small_mid_circle{
		
			background-color:#171B3B;
			width :50px;
			height:50px;
			border-radius:170px;
			border-color:#171B3B;
			border-width:2px;
			border-style:solid;
			font-family:Century Gothic;
			font-weight:normal;
			font-size:10px;
			color:#ffffff;
			justify-content:center;
			box-shadow:0px 0px 10px #ffffff;
			align-items:center;
			z-index:3}
	
	</style>
	
		<!-------- SPEEDOMETER KE BACKGROUND KI LINES KO BANA DIYA HAI YHA PAR ---------->
		
		<svg width = "1000px" height = "800px"  viewBox = "0 0 3000 2000" style = "position:absolute;z-index:4">
		
		<circle
		
		cx="1951"
		cy="852"
		r= "400"
		fill="none"
		stroke="#453A52"
		stroke-width="35px"
		stroke-dasharray = "10 36"
			
		/>
		<circle
		
		cx="1951"
		cy="852"
		r= "400"
		fill="none"
		stroke="#D7B5FF"
		stroke-width="55px"
		stroke-dasharray = "10 220"	
		/>
		
		</svg>
		

	<!-------- SPEEDOMETER KE LIYE NEEDLE ---------->
	
	<svg class = "needle_" width = "1000px" height = "800px"  viewBox = "0 0 3000 2000" style = "position:absolute;z-index:5">
		
<path

	id = "needle"
	
    d="
    M1965 519
    L1980 822
    Q1985 842 1951 852
    Q1928 842 1925 822
    L1955 502
    Q1965 482 1965 520
    "
    fill="#ff000090"
    stroke="#ff000090"
    stroke-width="4"
    stroke-linejoin="round"
    transform="rotate(-172 1951 852)"
/>
	
	</svg>
	
	
	<!-------- EXTRA NEEDLE KO COVER KARNE WALI MID CIRCLE AGAIN ---------->
	
	
	<div class = "small_mid_circle_2"></div>
	
	<style>
	
	.small_mid_circle_2{
		
			background-color:#171B3B;
			position:absolute;
			top:330px;
			left:631px;
			width :55px;
			height:55px;
			border-radius:50px;
			border-color:#171B3B;
			border-width:2px;
			
			z-index:5}
	
	
	</style>

	
	<script type = "py">
		from js import document
import asyncio

angle = -172

async def automatic_needle_ko_ghumane_vala_function():

    global angle

    while angle <= 155:

        document.getElementById("needle").setAttribute(
            "transform",
            f"rotate({angle} 1951 852)"
        )

        angle += 1

        await asyncio.sleep(0.02)


await automatic_needle_ko_ghumane_vala_function()
	</script>
	

</body>
</html>
