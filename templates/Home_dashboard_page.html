
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RJ Projects - Home Page</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #0B001F;
            color: white;
            font-family: "Century Gothic", Arial, sans-serif;
            overflow-x: hidden;
        }


        /* MAIN PAGE */

        .main_page {
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            isolation: isolate;
        }


        /* BACKGROUND IMAGES */

        .BACKGROUND_image_box {
            position: absolute;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        .BACKGROUND_image_box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
        }

        .logo_image_box {
            position: absolute;
            width: min(600px, 80%);
            aspect-ratio: 6 / 5;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
        }

        .logo_image_box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /* TOP HEADER */

        .top_header {
            width: 100%;
            min-height: 75px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background-color: #170040;
            border-bottom: 1px solid #ffffff50;
            position: relative;
            z-index: 10;
        }

        .logo_heading {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .logo_image {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border: 1px solid white;
            border-radius: 5px;
            padding: 3px;
            transition: 0.3s ease;
        }

        .logo_image:hover {
            box-shadow: 0 0 8px white;
        }

        .logo_image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .top_heading_box {
            min-width: 0;
            border-bottom: 1px solid white;
            padding: 5px 15px;
            border-radius: 0 0 20px 0;
        }

        .top_heading_box h1 {
            font-size: clamp(16px, 2.5vw, 27px);
            font-weight: 500;
            letter-spacing: 2px;
        }


        /* LOGIN BUTTON */

        .upper_top_login_button {
            width: 130px;
            min-height: 40px;
            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 2px solid white;
            border-radius: 10px;

            color: white;
            font-size: 18px;
            cursor: pointer;

            position: relative;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .upper_top_login_button::before {
            content: "";
            position: absolute;
            width: 15px;
            height: 100px;
            top: -30px;
            left: -40px;
            background: #ffffff90;
            box-shadow: 0 0 20px white;
            transform: rotate(30deg);
            animation: login_light 3s linear infinite;
        }

        .upper_top_login_button:hover {
            box-shadow: 0 0 10px white;
            transform: translateY(-2px);
        }

        .upper_top_login_button span {
            position: relative;
            z-index: 1;
        }

        @keyframes login_light {
            0% {
                left: -40px;
            }

            100% {
                left: 200px;
            }
        }


        /* NAVIGATION BAR */

        .navigation_section {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .top_selecting_bar_names {
            width: min(100%, 1000px);
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            border-top: 1px solid white;
            border-bottom: 1px solid white;
        }

        .secting_bar_tag {
            flex: 1 1 130px;
            min-height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            border-radius: 40px;
            cursor: pointer;
            position: relative;
            transition: 0.3s ease;
            font-size: 15px;
            text-align: center;
        }

        .secting_bar_tag::before,
        .secting_bar_tag::after {
            content: "";
            position: absolute;
            width: 65%;
            height: 2px;
            left: 17.5%;
            background: white;
            opacity: 0;
            box-shadow: 0 0 7px white;
            transition: 0.3s ease;
        }

        .secting_bar_tag::before {
            top: 0;
        }

        .secting_bar_tag::after {
            bottom: 0;
        }

        .secting_bar_tag:hover {
            text-shadow: 0 0 8px white;
            background-color: #ffffff12;
        }

        .secting_bar_tag:hover::before,
        .secting_bar_tag:hover::after {
            opacity: 1;
        }


        /* WELCOME SECTION */

        .welcome_area {
            width: 100%;
            flex: 1;
            min-height: 450px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;

            padding: 40px 15px;
            position: relative;
        }


        /* WELCOME LETTERS */

        .welcome_screen_box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: clamp(2px, 1vw, 10px);
        }

        .letter_uper_line {
            width: clamp(25px, 5vw, 55px);
            height: 65px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: clamp(25px, 5vw, 50px);
            font-weight: 400;

            animation: move_box 0.5s linear backwards;
        }

        .letter_uper_line:nth-child(1) {
            animation-delay: 0s;
        }

        .letter_uper_line:nth-child(2) {
            animation-delay: 0.1s;
        }

        .letter_uper_line:nth-child(3) {
            animation-delay: 0.2s;
        }

        .letter_uper_line:nth-child(4) {
            animation-delay: 0.3s;
        }

        .letter_uper_line:nth-child(5) {
            animation-delay: 0.4s;
        }

        .letter_uper_line:nth-child(6) {
            animation-delay: 0.5s;
        }

        .letter_uper_line:nth-child(7) {
            animation-delay: 0.6s;
        }

        .letter_uper_line:nth-child(8) {
            animation-delay: 0.7s;
        }

        @keyframes move_box {

            0% {
                transform: translateY(-130px);
                opacity: 0;
            }

            50% {
                transform: translateY(30px);
                font-size: clamp(35px, 7vw, 75px);
            }

            70% {
                transform: translateY(-10px);
                font-weight: 800;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }


        /* CMDR TEXT */

        .calling_root {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .letter_neeche_line {
            width: clamp(30px, 5vw, 55px);
            height: 65px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #F7FF00;
            font-size: clamp(35px, 7vw, 70px);
            font-weight: 400;

            animation: move_box_down 0.5s linear 0.8s backwards;
        }

        @keyframes move_box_down {

            0% {
                transform: translateY(-100px);
                opacity: 0;
            }

            80% {
                transform: translateY(15px);
                font-weight: 800;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }


        /* START BUTTON */

        .start_button {
            width: 250px;
            max-width: 90%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            border: 1px solid white;
            border-radius: 20px;

            color: white;
            font-size: 18px;
            cursor: pointer;

            opacity: 0;
            animation: let_start_button_animation 0.5s ease 1.5s forwards;
            transition: 0.3s ease;
        }

        @keyframes let_start_button_animation {

            0% {
                transform: translateY(80px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .start_button:hover {
            box-shadow: 0 0 9px white;
            transform: translateY(-2px) scale(1.02);
        }

        .briting_lining {
            position: absolute;
            width: 20px;
            height: 155px;
            top: -40px;
            left: -50px;

            background: #ffffff00;
            box-shadow: 40px 70px 20px #ffffff90;
            transform: rotate(30deg);

            animation: moving_brighting_rod 3s linear infinite;
            pointer-events: none;
        }

        @keyframes moving_brighting_rod {

            0% {
                left: -55px;
            }

            30% {
                left: 300px;
            }

            100% {
                left: 300px;
            }
        }


        /* START BUTTON HIDE ANIMATION */

        .hide_welcome {
            animation: hiding_welcome 0.4s ease forwards;
        }

        @keyframes hiding_welcome {
            to {
                opacity: 0;
                transform: translateY(-40px);
                visibility: hidden;
            }
        }


        /* RESPONSIVE DESIGN */

        @media (max-width: 650px) {

            .top_header {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo_heading {
                width: 100%;
                justify-content: center;
            }

            .upper_top_login_button {
                width: 110px;
            }

            .top_selecting_bar_names {
                gap: 5px;
            }

            .secting_bar_tag {
                flex: 1 1 110px;
                font-size: 13px;
            }

            .welcome_area {
                min-height: 400px;
            }
        }

        @media (max-width: 380px) {

            .top_heading_box h1 {
                letter-spacing: 1px;
                font-size: 15px;
            }

            .logo_image {
                width: 42px;
                height: 42px;
            }

            .secting_bar_tag {
                flex-basis: 100%;
            }

        }

    </style>

</head>


<body>

<div class="main_page">


    <!-- BACKGROUND IMAGE -->

    <div class="BACKGROUND_image_box">

        <img src="../static/background_of_website_page.png"
             alt="Website background">

    </div>


    <!-- WATERMARK LOGO -->

    <div class="logo_image_box">

        <img src="../static/RJ_Techs_logo.png"
             alt="RJ Technologies logo">

    </div>


    <!-- TOP HEADER -->

    <header class="top_header">


        <!-- LOGO AND HEADING -->

        <div class="logo_heading">

            <div class="logo_image">

                <img src="../static/RJ_logo_for_upper_ribbon.png"
                     alt="RJ Logo">

            </div>


            <div class="top_heading_box">

                <h1>THE WORKOUT ZONE</h1>

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <div class="upper_top_login_button"
             onclick="open_the_login_page()">

            <span>Login</span>

        </div>


    </header>


    <!-- NAVIGATION BAR -->

    <nav class="navigation_section">

        <div class="top_selecting_bar_names">

            <div class="secting_bar_tag">
                Attendance
            </div>

            <div class="secting_bar_tag">
                Fees
            </div>

            <div class="secting_bar_tag">
                Machines
            </div>

            <div class="secting_bar_tag">
                Supplements
            </div>

            <div class="secting_bar_tag">
                Others
            </div>

        </div>

    </nav>


    <!-- WELCOME SECTION -->

    <main class="welcome_area" id="welcome_area">


        <!-- WELCOME TEXT -->

        <div class="welcome_screen_box">

            <div class="letter_uper_line">W</div>
            <div class="letter_uper_line">E</div>
            <div class="letter_uper_line">L</div>
            <div class="letter_uper_line">C</div>
            <div class="letter_uper_line">O</div>
            <div class="letter_uper_line">M</div>
            <div class="letter_uper_line">E</div>
            <div class="letter_uper_line">!</div>

        </div>


        <!-- CMDR TEXT -->

        <div class="calling_root">

            <div class="letter_neeche_line">C</div>
            <div class="letter_neeche_line">M</div>
            <div class="letter_neeche_line">D</div>
            <div class="letter_neeche_line">R</div>

        </div>


        <!-- START BUTTON -->

        <div class="start_button"
             onclick="hide_welcome_and_cmdr_with_button()">

            LET'S START

            <div class="briting_lining"></div>

        </div>


    </main>


</div>


<script>

    /* OPEN LOGIN PAGE */

    function open_the_login_page() {

        window.open("/login_page.html", "_self");

    }


    /* HIDE WELCOME SECTION */

    function hide_welcome_and_cmdr_with_button() {

        const welcomeArea =
            document.querySelector(".welcome_area");

        welcomeArea.classList.add("hide_welcome");

    }

</script>


</body>

</html>
