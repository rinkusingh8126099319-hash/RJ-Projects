		<!------------------------------ CHECKING THE EMAIL ID (ID SHI HAI YA NHI) --------------------------------------->
		
		<script>
		
		function check_the_email_id(){
			let email_id = document.getElementsByClassName("entry_box_of_EMAIL_ID_for_create_a_new_account")[0].value;
			
			if(email_id.endsWith("@gmail.com")){pass_this_email_id()}
			
			else{alert("Please enter a valid Email Id")}
			}
		
		async function pass_this_email_id(){

    alert("Pass function started!");

    await send_data();

    alert("Send data function completed!");
}

async function send_data(){

    alert("Send data started!");

    let email = document.querySelector(
        ".entry_box_of_EMAIL_ID_for_create_a_new_account"
    ).value;

    try {

        let response = await fetch("/receive_data", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({email: email})
        });

        if(response.ok){
            alert("EMAIL REQUEST SUCCESSFUL!");
        }
        else{
            alert("EMAIL REQUEST FAILED!");
        }

    }
    catch(error){
        alert("SERVER CONNECTION FAILED!");
        console.error(error);
    }
}
